<script>
  (function(){
    const loader = document.getElementById('bootloader');
    const spinner = loader && loader.querySelector('.bootloader__spinner');
    const MIN_MS = 600; // minimum visible time for the loader
    const MAX_MS = 5000; // fail-safe maximum
    const start = Date.now();

    function adaptForDPR(){
      try{
        const dpr = window.devicePixelRatio || 1;
        if(spinner){
          const base = 64;
          const size = Math.round(base * Math.min(1.6, Math.max(1, dpr)));
          spinner.style.width = size + 'px';
          spinner.style.height = size + 'px';
        }
      }catch(e){/*ignore*/}
    }

    function hideLoader(){
      if(!loader) return;
      loader.setAttribute('aria-hidden','true');
      // remove from accessibility tree after animation
      setTimeout(()=> loader.style.display = 'none', 520);
    }

    function readyToHide(){
      const elapsed = Date.now() - start;
      const wait = Math.max(0, MIN_MS - elapsed);
      setTimeout(hideLoader, wait);
    }

    // Wait for fonts + window load when available; otherwise fallback
    const fontReady = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();

    Promise.all([fontReady, new Promise(resolve => {
      if(document.readyState === 'complete') return resolve();
      window.addEventListener('load', resolve, {once:true, capture:true});
      // also resolve on DOMContentLoaded as a faster heuristic
      window.addEventListener('DOMContentLoaded', resolve, {once:true, capture:true});
    })])
    .then(readyToHide)
    .catch(readyToHide);

    // Timeout safety: ensure loader never blocks beyond MAX_MS
    setTimeout(hideLoader, MAX_MS);

    // Adapt UI for display
    adaptForDPR();
    window.matchMedia('(resolution)').addEventListener?.('change', adaptForDPR);

    // If user prefers reduced motion, hide spinner animation sooner
    if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches){
      if(spinner) spinner.style.animation = 'none';
    }
  })();
</script>
