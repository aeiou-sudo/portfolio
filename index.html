<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Portfolio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header" role="banner">
    <div class="hero">
      <h1 class="hero-name">Your Name</h1>
      <p class="hero-title">Your Title</p>
    </div>

    <button id="theme-toggle" class="theme-toggle" aria-pressed="false" aria-label="Toggle theme">Toggle</button>
  </header>

  <main class="site-main" role="main">
    <section class="content-columns" aria-label="Main content">
      <article class="column" id="col-1">Column 1</article>
      <article class="column" id="col-2">Column 2</article>
      <article class="column" id="col-3">Column 3</article>
    </section>
  </main>

  <script type="module" src="script.js"></script>
</body>
</html>
